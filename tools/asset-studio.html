<aside><small>LUMEXIA / ASSET STUDIO</small><h1>Yeni çevre varlıkları</h1><p>Özgün 3D geometri, doğal malzemeler ve gerçekçi ölçüler. Sürükleyerek döndürün; tekerlekle yaklaşın.</p><label for="asset">VARLIK SEÇİMİ</label><select id="asset"><option value="all">Bütün varlıklar</option></select><button id="rotate">Döndürmeyi başlat</button><button id="reset">Kamerayı sıfırla</button><output id="metrics">Varlıklar hazırlanıyor…</output></aside><div id="status">Yükleniyor…</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {buildArchitectureAssets} from '/src/environment/architecture.js';
import {buildNatureAssets} from '/src/environment/nature.js';
import {buildStreetDetailsAssets} from '/src/environment/street-details.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#b8c8cf');scene.fog=new THREE.Fog('#b8c8cf',150,350);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,900);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=190;
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.45;
scene.add(new THREE.HemisphereLight('#dce7f1','#696b50',.85));const sun=new THREE.DirectionalLight('#fff0d6',2.65);sun.position.set(-35,60,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-90,right:90,top:70,bottom:-70,near:1,far:220});sun.shadow.normalBias=.05;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:'#9ba18a',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);
const loader=new THREE.TextureLoader();const [leafTexture,barkTexture]=await Promise.all(['/textures/roadside/oak-leaves.png','/textures/roadside/bark.png'].map(p=>loader.loadAsync(p)));leafTexture.colorSpace=barkTexture.colorSpace=THREE.SRGBColorSpace;barkTexture.wrapS=barkTexture.wrapT=THREE.RepeatWrapping;leafTexture.anisotropy=barkTexture.anisotropy=8;
const assets={...buildArchitectureAssets(),...buildNatureAssets({leafTexture,barkTexture}),...buildStreetDetailsAssets()};const collection=new THREE.Group();scene.add(collection);const names=Object.keys(assets);const stats={};
for(const [name,model] of Object.entries(assets)){model.name=name;model.traverse(n=>{if(n.isMesh){n.castShadow=n.receiveShadow=true;}});const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());let triangles=0,draws=0,finite=true;model.traverse(n=>{if(n.isMesh){triangles+=(n.geometry.index?n.geometry.index.count:n.geometry.attributes.position.count)/3;draws++;finite&&=Array.from(n.geometry.attributes.position.array).every(Number.isFinite);}});stats[name]={triangles,draws,size:size.toArray().map(v=>Number(v.toFixed(2))),finite};const option=document.createElement('option');option.value=name;option.textContent=name;document.querySelector('select').append(option);collection.add(model);}
document.querySelector('#metrics').dataset.assets=JSON.stringify(stats);
function view(name){for(const model of collection.children){model.visible=name==='all'||model.name===name;model.position.set(0,0,0);model.rotation.y=0;if(name==='all'){const i=names.indexOf(model.name);model.position.set((i%5-2)*24,0,-Math.floor(i/5)*34);}}
if(name==='all'){controls.target.set(0,8,-25);camera.position.set(72,50,89);}else{const size=stats[name].size;const r=Math.max(...size);controls.target.set(0,size[1]*.42,0);camera.position.set(r*1.3,size[1]*.9,r*1.6);}
controls.update();document.querySelector('#metrics').textContent=name==='all'?`${names.length} özgün varlık • ${Object.values(stats).reduce((a,b)=>a+b.triangles,0).toLocaleString()} toplam üçgen`:`${stats[name].triangles.toLocaleString()} üçgen · ${stats[name].draws} malzeme grubu\nBoyut: ${stats[name].size.join(' × ')} m\nSonlu koordinatlar: ${stats[name].finite}`;}
document.querySelector('select').onchange=e=>view(e.target.value);document.querySelector('#reset').onclick=()=>view(document.querySelector('select').value);document.querySelector('#rotate').onclick=()=>{controls.autoRotate=!controls.autoRotate;document.querySelector('#rotate').textContent=controls.autoRotate?'Döndürmeyi durdur':'Döndürmeyi başlat';};view('all');
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});let frames=0,last=performance.now();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);frames++;const now=performance.now();if(now-last>1000){document.querySelector('#status').textContent=`${Math.round(frames*1000/(now-last))} FPS | ${renderer.info.render.calls} draw calls | ${renderer.info.render.triangles.toLocaleString()} tris`;frames=0;last=now;}});
