<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lumexia — Garage Test Drive</title>
    <style>
      .garage-check-toolbar { position: fixed; inset: 0 0 auto; height: 50px; box-sizing: border-box; z-index: 1000; display: flex; align-items: center; gap: 12px; padding: 0 14px; overflow-x: auto; background: #14251f; border-bottom: 1px solid #66816c; color: #efffe9; font: 12px/1.3 system-ui, sans-serif; }
      .garage-check-toolbar > * { flex-shrink: 0; }
      .garage-check-toolbar button { min-height: 34px; padding: 6px 10px; border: 1px solid #91ad83; border-radius: 5px; background: #263c2b; color: #efffe9; font: inherit; cursor: pointer; }
      .garage-check-toolbar button:focus-visible { outline: 2px solid #e1f98b; outline-offset: 2px; }
      #root .lx-menu-page { top: 50px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./garage-check.jsx"></script>
  </body>
</html>
