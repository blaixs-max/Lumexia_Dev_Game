<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lumexia mobile controls check</title>
    <style>
      html, body { margin: 0; overflow: hidden; }
      .fixture-scene { pointer-events: none; background: linear-gradient(#a2c1cd 0 28%, #556e59 28% 38%, #485259 38%); }
      .fixture-road { position: absolute; inset: 38% 10% 0; background: repeating-linear-gradient(0deg, transparent 0 70px, #d7ded79c 70px 110px) center / 3px 100% no-repeat, #333e45; }
      .fixture-vehicle { position: absolute; left: 50%; top: 75%; width: clamp(48px, 14vw, 96px); height: clamp(65px, 16vh, 125px); transform: translate(-50%, -50%); border: 2px solid #edba92; border-radius: 20% 20% 12% 12%; background: #ab3027; box-shadow: 0 8px 12px #0007; display: grid; place-items: center; color: #fff; font: 9px/1.4 system-ui; text-align: center; }
      #check-toolbar { position: fixed; top: 3px; left: 50%; transform: translateX(-50%); z-index: 10000; text-align: center; pointer-events: none; }
      #run-checks { pointer-events: auto; padding: 5px 9px; border: 1px solid #9bbdae; border-radius: 4px; background: #14251f; color: #ecffe7; font: 11px system-ui; cursor: pointer; white-space: nowrap; }
      #check-status { display: block; max-width: 170px; padding-top: 3px; color: white; font: 9px/1.3 system-ui; text-shadow: 0 1px 3px black; }
      #check-details { position: fixed; bottom: 5px; left: 50%; transform: translateX(-50%); z-index: 10000; width: min(92vw, 600px); color: #d9efdf; background: #07140fe8; border: 1px solid #648275; border-radius: 4px; font: 10px/1.4 monospace; }
      #check-details summary { cursor: pointer; padding: 4px 8px; text-align: center; }
      #check-results { max-height: 45vh; overflow: auto; padding: 8px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="check-toolbar"><button id="run-checks" type="button">Run checks</button><output id="check-status">Synthetic events · no GPU</output></div>
    <details id="check-details"><summary>DOM checks · results and state journal</summary><pre id="check-results" data-result="{}">Ready. Uses the real controls, HUD, CSS, and game store. No physics loop or GPU.</pre></details>
    <script type="module" src="./mobile-controls-check.jsx"></script>
  </body>
</html>
